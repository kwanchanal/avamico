<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Avamico — thoughtful creative collaboration, from first hello to finished work."
    />
    <meta name="theme-color" content="#f9abca" />
    <title>Avamico — Hello</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400&family=IBM+Plex+Sans+Thai:wght@400&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="hero-greeting">
        <header class="site-header">
          <a class="brand" href="#top" aria-label="Avamico home">Avamico</a>

          <nav class="site-nav" aria-label="Primary navigation">
            <a class="button button--outline" href="#projects">Our Project</a>
            <a class="button button--solid" href="mailto:hello@avamico.com">
              Get In Touch
              <span class="button__arrow" aria-hidden="true">↗</span>
            </a>
          </nav>
        </header>

        <div class="hero__stage" id="top">
          <h1 class="greeting" id="hero-greeting">
            <span class="greeting__viewport" aria-hidden="true">
              <span class="greeting__word" data-greeting>Hello,</span>
            </span>
            <span class="sr-only">Hello,</span>
          </h1>

          <div class="portrait" aria-label="Three friends working together">
            <img
              class="portrait__image portrait__image--base"
              src="image/Hero.png"
              alt="Three classically dressed friends writing and working on a laptop"
            />
            <img class="portrait__image portrait__rig portrait__rig--writing" src="image/Hero.png" alt="" />
            <img class="portrait__image portrait__rig portrait__rig--typing-left" src="image/Hero.png" alt="" />
            <img class="portrait__image portrait__rig portrait__rig--typing-right" src="image/Hero.png" alt="" />
          </div>

          <aside class="hero__contact" aria-label="Start a project">
            <p class="hero__contact-copy">
              Avamico<br />
              From 'Avanti/Avanzar'<br />
              (forward) &amp; 'Amico/<br />
              Amigo' (friend).<br />
              Together is better.
            </p>
            <a class="button button--solid" href="mailto:hello@avamico.com">
              Get In Touch
              <span class="button__arrow" aria-hidden="true">↗</span>
            </a>
          </aside>
        </div>
      </section>

      <section class="projects" id="projects" aria-labelledby="projects-title">
        <h2 id="projects-title">Selected Work</h2>
        <p class="projects__intro">
          Digital experiences built to help people learn, work, and move forward—together.
        </p>

        <div class="work-marquee">
          <div class="work-track">
            <div class="work-set">
              <a class="work-card" href="#contact" aria-label="E-learning system project">
                <img src="image/Project1.png" alt="E-learning system" />
              </a>
              <a class="work-card" href="#contact" aria-label="HR system project">
                <img src="image/Project2..png" alt="HR system" />
              </a>
              <a class="work-card" href="#contact" aria-label="Interactive learning system project">
                <img src="image/Project3.png" alt="Interactive learning system" />
              </a>
              <a class="work-card" href="#contact" aria-label="More projects">
                <img src="image/Project4.png" alt="More projects" />
              </a>
            </div>
            <div class="work-set" aria-hidden="true">
              <span class="work-card"><img src="image/Project1.png" alt="" /></span>
              <span class="work-card"><img src="image/Project2..png" alt="" /></span>
              <span class="work-card"><img src="image/Project3.png" alt="" /></span>
              <span class="work-card"><img src="image/Project4.png" alt="" /></span>
            </div>
            <div class="work-set" aria-hidden="true">
              <span class="work-card"><img src="image/Project1.png" alt="" /></span>
              <span class="work-card"><img src="image/Project2..png" alt="" /></span>
              <span class="work-card"><img src="image/Project3.png" alt="" /></span>
              <span class="work-card"><img src="image/Project4.png" alt="" /></span>
            </div>
            <div class="work-set" aria-hidden="true">
              <span class="work-card"><img src="image/Project1.png" alt="" /></span>
              <span class="work-card"><img src="image/Project2..png" alt="" /></span>
              <span class="work-card"><img src="image/Project3.png" alt="" /></span>
              <span class="work-card"><img src="image/Project4.png" alt="" /></span>
            </div>
          </div>
        </div>
      </section>

      <footer class="site-footer" id="contact">
        <div class="site-footer__art">
          <img
            class="site-footer__image"
            src="image/Footer.png"
            alt="Three thinkers gathered around a laptop, books, and maps"
          />
          <span class="footer-rig footer-rig--eyes footer-rig--eyes-left"><img src="image/Footer.png" alt="" /></span>
          <span class="footer-rig footer-rig--eyes footer-rig--eyes-centre"><img src="image/Footer.png" alt="" /></span>
          <span class="footer-rig footer-rig--eyes footer-rig--eyes-right"><img src="image/Footer.png" alt="" /></span>
          <span class="footer-rig footer-rig--mouth footer-rig--mouth-left"><img src="image/Footer.png" alt="" /></span>
          <span class="footer-rig footer-rig--mouth footer-rig--mouth-centre"><img src="image/Footer.png" alt="" /></span>
          <span class="footer-rig footer-rig--mouth footer-rig--mouth-right"><img src="image/Footer.png" alt="" /></span>
          <span class="footer-rig footer-rig--finger"><img src="image/Footer.png" alt="" /></span>
        </div>
        <a class="button button--solid site-footer__cta" href="mailto:hello@avamico.com">
          Get In Touch
          <span class="button__arrow" aria-hidden="true">↗</span>
        </a>
      </footer>
    </main>
  </body>
</html>
